
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Fit - Alunos</title>
    <link rel="stylesheet" href="alunos.css">
</head>
<body>

    <aside class="menu">
        <h1>IRON <span>FIT</span></h1>

        <nav>
            <a href="alunos.html">Alunos</a>
            <a href="planos.html">Planos</a>
            <a href="matriculas.html">Matrículas</a>
            <a href="pagamentos.html">Pagamentos</a>
        </nav>

        <a href="index.html" class="sair">Sair</a>
    </aside>

    <main class="conteudo">

        <div class="topo">
            <h2>Alunos</h2>

            <details class="novo-aluno">
                <summary>+ Novo aluno</summary>

                <form id="form-aluno">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Nome completo" required>

                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>

                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" placeholder="Telefone">

                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="E-mail">

                    <label for="nascimento">Data de nascimento</label>
                    <input type="date" id="nascimento">

                    <button type="submit">Salvar aluno</button>
                </form>
            </details>
        </div>

        <!-- Escolha de plano -->
        <div id="tela-planos" class="tela-planos" style="display: none;">

            <div class="cabecalho-planos">
                <div>
                    <h2>Escolha um plano</h2>
                    <p id="nome-aluno-plano">Selecione o plano do aluno</p>
                </div>

                <button type="button" onclick="fecharPlanos()">Voltar</button>
            </div>

            <div id="lista-planos" class="lista-planos">
            </div>

        </div>

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th>Nascimento</th>
                        <th>Plano</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabela-alunos">
                    <tr>
                        <td colspan="7">Nenhum aluno cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
